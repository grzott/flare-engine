# Cold-start TTI capture — single cold launch.
#
# `App.tsx` calls `dumpBootTrace()` immediately after `markBootMilestone('first-frame')`,
# which prints one `[boot-trace] total=<ms>...` line via `console.log`. Maestro is not
# the right tool to assert on console output — it asserts on UI. The pattern is:
#
# 1. This flow does the cold launch (state cleared, app stopped, then launched).
# 2. The runner harness (`scripts/run-smoke-local.sh` locally, `testingbot maestro`
#    in cloud) tails logcat / device logs and parses the `[boot-trace]` line via
#    `scripts/parse-boot-trace.ts` into a typed `TtiResult`.
# 3. The TTI gate `< 3000ms` is asserted by the harness, not by Maestro.
#
# Run this flow N times (typically 3) and take the median total. The harness
# orchestrates the loop; this YAML is one iteration.
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- extendedWaitUntil:
    visible: "Play"
    timeout: 10000
- stopApp

# Boss-fight smoke — SKELETON FLOW.
#
# This flow targets device-smoke rows 3 / 4 / 5 / 8 / 11 / 12 (Zone 1-3 progression,
# IAP gate, bomb FX, boss phase transitions). Maestro asserts on UI elements, not on
# Skia-canvas game state, so this flow currently only covers what's reachable through
# overlays + HUD labels. Full gameplay assertions need a debug HUD that exposes game
# state as readable text.
#
# Status: WIP / skeleton. Run locally to validate launch + first-zone boot; do NOT
# rely on this flow as a release-readiness gate yet. Tracked as a follow-up row in
# `docs/plans/sessions.md` (PT-DebugHud-State).
#
# What's missing for a full version:
# - HUD text element exposing `aliveEnemies`, `bossHp`, `currentZone`, etc. (debug only).
# - Reachable accessibilityIdentifier on bomb button + score label.
# - Hook into bomb-fired event so Maestro can wait for the next-frame post-bomb HUD update.
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: "Play"
    timeout: 10000
- tapOn: "Play"
- assertVisible: "Choose a save slot"
- tapOn:
    point: "50%,50%"
- waitForAnimationToEnd:
    timeout: 5000
# Once in the play scene we can't see UI text reliably (HUD uses Skia text or compact
# numerics); skip further assertions until the debug HUD lands.
- back
- back
- assertVisible: "Play"
- stopApp

name: PT Smoke — UI navigation
tags:
  - smoke
  - functional
---
# PT smoke flow — UI navigation regression catcher.
#
# Covers reachable rows of `docs/device-smoke.md`: 1, 2 (partial), 6, 7, 13.
# Codex (row 9) and Achievements (row 10) are NOT reachable from the main menu
# in the current build (no button wired); they're deep-link-only. Tracked as a
# follow-up: a debug menu button or a deep-link smoke pass.
# Game-state assertions (rows 3-5, 8, 11, 12) are skipped here — see boss-fight.yaml
# (skeleton, blocked on debug HUD).
#
# Run locally:    maestro test .maestro/smoke.yaml
# Run on cloud:   testingbot maestro <apk> .maestro/smoke.yaml --device "Galaxy A55"
#
# Edit guidance: any text matcher below mirrors a `locales/en.json` key — keep them
# in sync when locale strings change. PL parity is verified by `bun run check:locales`.
# Skia-rendered text (panel titles, in-game HUD) is NOT in the accessibility tree and
# CANNOT be matched — assert against RN-rendered controls (Button labels, toggle
# names) instead.
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true

# Row 1 — boot to menu without crash. The boot overlay's "Loading…" text is
# observable when present, but on fast devices it flashes too briefly to assert
# reliably; on slow/cold devices the menu can take >10s to appear (audio init,
# save load, RN bridge warmup). Just wait for "Play" with a generous timeout.
# "Play" is matched via the accessibilityLabel set by Button.label from @flare-engine/ui.
- extendedWaitUntil:
    visible: "Play"
    timeout: 90000

# Row 2 — menu nav: Play → save-select → Back; Settings → Back; Credits → tap-to-return.
- tapOn: "Play"
- assertVisible: "Choose a save slot"
- tapOn:
    text: "Back"
    index: 0
- assertVisible: "Play"

- tapOn: "Settings"
- assertVisible: "Reduced motion"
- tapOn:
    text: "Back"
    index: 0
- assertVisible: "Play"

- tapOn: "Credits"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    point: "50%,50%"
- assertVisible: "Play"

# Row 6 — settings persist across kill+reopen.
- tapOn: "Settings"
- assertVisible: "Reduced motion"
- tapOn: "Reduced motion"
- tapOn:
    text: "Back"
    index: 0
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Play"
    timeout: 90000
- tapOn: "Settings"
- assertVisible: "Reduced motion"
# Toggle state should be retained from before stopApp; if Maestro can read the
# toggle's accessibilityState we'd assert here. Visual-state assertion deferred
# to a follow-up once the Toggle exposes accessibilityState.checked through RN.
- tapOn:
    text: "Back"
    index: 0

# Row 13 — reduced-motion toggle reaches menu without crash. Skip entering the
# play scene: it's a Skia canvas with no RN-accessible state, and the back-out
# path is unreliable through Maestro. Functional regression catch is the menu
# nav above.
- assertVisible: "Play"

- stopApp

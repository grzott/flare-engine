name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run check:deps
      - run: bun run check:changeset
      - run: bun run check:peers

      # Level, not coverage: refuses an above-patch bump without an accepted ADR.
      - run: bun run check:bump
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test

      # The only config covering packages/*/tests. After build, never before:
      # a test importing a sibling by package name resolves to its dist/*.d.mts.
      - run: bun run typecheck:tests
      - run: bun run check:exports
      - run: bun run check:nodenext
      - run: bun run check:readme

      # Track A — exact integers, safe to hard-gate on a shared runner.
      # Wall-clock (Track B) is never gated here: a GitHub-hosted runner swings
      # ±50% and the gate would be noise. See perf-measurement-2026-07.md §4.
      - name: Perf counters + rubber-stamp guard
        run: bun run check:perf
        env:
          # The range the review guard inspects: a PR's base, or the commit the
          # push started from. Without it the guard only sees the tip commit.
          FLARE_PERF_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

      # ~60 s: packs all 42 publishable packages. CI is the right place for it —
      # the local /close gate stays fast and this runs before anything merges.
      - run: bun run check:perf-bytes

      # OSS-F3 leak detector over packed tarball bytes (~30 s), same rationale.
      # Runs its own --selftest first: a detector nobody proves still fires is
      # the failure mode HYG9 exists to remove.
      - run: bun run check:tarballs

      # B24 keystone: do the published numbers still describe HEAD?
      - run: bun run check:perf-freshness

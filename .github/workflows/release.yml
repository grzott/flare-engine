name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Opt-in: off until the flip (docs/plans/flip-runbook.md). Every package
    # publishes from this job once `ENABLE_RELEASE` is set to 'true'.
    if: ${{ vars.ENABLE_RELEASE == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # `changeset publish` shells out to npm. Pin a known npm rather than
      # inheriting the runner image's: trusted publishing (OIDC) and provenance
      # need npm >= 11.5.1, and the image's npm is not that.
      # No `registry-url` here on purpose: it makes setup-node write its own
      # .npmrc keyed to NODE_AUTH_TOKEN, and that token line would shadow the
      # OIDC exchange the publish relies on.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11
      - run: npm --version

      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test
      - run: bun run check:exports
      - run: bun run check:nodenext

      # B19: a publish must not be able to bypass the perf gate. ci.yml runs on
      # the same push, but a red CI does not stop this workflow — the two are
      # independent jobs, so the gate is repeated on the path that ships bytes
      # to consumers.
      - run: bun run check:perf
        env:
          FLARE_PERF_BASE_REF: ${{ github.event.before }}
      - run: bun run check:perf-bytes
      - run: bun run check:perf-freshness

      # No NPM_TOKEN: npm trusted publishing authenticates through the
      # `id-token: write` permission above. changesets/action v1 writes no
      # .npmrc token when NPM_TOKEN is unset and an OIDC token is available.
      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          publish: bun run release
          version: bun run version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          # The bot's token, not GITHUB_TOKEN: the "version packages" PR it opens must trigger CI
          # and the gate, and is held for the owner's tap (it changes every CHANGELOG). Merging that
          # PR is the release. GITHUB_TOKEN-created PRs trigger no workflows, so it is only the
          # fallback until the bot secret exists.
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

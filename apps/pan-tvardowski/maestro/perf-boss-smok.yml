appId: dev.flare.pantvardowski
name: "PT Perf — boss-smok-full"
tags:
  - perf
  - bench
---
# Perf scenario: boss-smok-full
#
# Primary gate for Tier-A (shadow-rim drawRect replacement) and first pass of
# Tier-B (postfx chain collapse). Exercises Smok Krzemionkowski phase 1→2 with
# full rim-light + shadow-map + 3-postfx passes for the full 30s window.
#
# Requires a build with EXPO_PUBLIC_BENCH_MODE=1 baked (EAS bench profile, E5).
# In release profile the deep-link activates bench mode at route time.
#
# Run locally:  maestro test maestro/perf-boss-smok.yml
# Run on cloud: testingbot maestro <apk> maestro/perf-boss-smok.yml --device "Pixel 6a"
#
# Readiness wait: see perf-boot.yml header — wait for "Play" before openLink
# so the deep-link listener is wired and boot init is complete.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Play"
    timeout: 60000
- openLink: "pantvardowski://bench/boss-smok-full"
- extendedWaitUntil:
    visible:
      id: "BENCH_DONE"
    timeout: 60000
- assertVisible:
    id: "BENCH_DONE"

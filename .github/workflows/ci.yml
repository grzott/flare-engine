name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run check:deps
      - run: bun run check:changeset
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test
      - run: bun run check:exports
      - run: bun run check:nodenext

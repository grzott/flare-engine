appId: dev.flare.pantvardowski
name: "PT Perf — boot"
tags:
  - perf
  - bench
---
# Perf scenario: boot
#
# Opens the bench deep-link for the boot scenario, waits for the BENCH_DONE
# sentinel (RN testID rendered by App.tsx once the scenario completes), then
# asserts it is visible so Maestro marks the flow as passed.
#
# BENCH_DONE is a React Native <Text testID="BENCH_DONE"> element — it lives in
# the RN view tree, not the Skia canvas, so Maestro's id matcher can find it.
#
# Timeout 90s: conservative for slow device cold-start + 30s scenario duration.
# Reduce once baseline wall-clock numbers from E8 are known.
#
# Run locally:  maestro test maestro/perf-boot.yml
# Run on cloud: testingbot maestro <apk> maestro/perf-boot.yml --device "Pixel 6a"
#
# Readiness wait: we must NOT openLink before the JS bridge has wired
# Linking.addEventListener (inside bootstrap() in App.tsx). Waiting for the
# main-menu "Play" button guarantees: (a) JS bundle loaded, (b) GameView.onReady
# fired, (c) DeepLinkManager.start() called, (d) save + audio init complete.
# Locale assumption: device locale is en (cloud: --device-locale en per #107).
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Play"
    timeout: 60000
- openLink: "pantvardowski://bench/boot"
- extendedWaitUntil:
    visible:
      id: "BENCH_DONE"
    timeout: 60000
- assertVisible:
    id: "BENCH_DONE"
# Extract the perf report JSON rendered as the BENCH_DONE Text content.
# release Hermes does not forward console.log to native logcat, so we
# surface the JSON via copyTextFrom → evalScript console.log, which Maestro
# captures in maestro.log (TestingBot artifact: logs/maestro.txt).
- copyTextFrom:
    id: "BENCH_DONE"
- evalScript: ${console.log(maestro.copiedText)}

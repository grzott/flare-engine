appId: dev.flare.pantvardowski
name: "PT Perf — particle-storm"
tags:
  - perf
  - bench
---
# Perf scenario: particle-storm
#
# Stress-tests the particle pool ceiling (480 entities). Calls triggerExplosion
# until lifetimeQuery reaches BUDGET_LIMITS.particles, then holds at cap for
# the remainder of the 30s window. Used to measure worst-case particle draw
# cost before and after Tier-A/B optimizations.
#
# Intended for the EAS bench profile (EXPO_PUBLIC_BENCH_MODE=1 baked). No auth,
# IAP, or anti-cheat in that profile — pure render stress.
#
# Run locally:  maestro test maestro/perf-particle-storm.yml
# Run on cloud: testingbot maestro <apk> maestro/perf-particle-storm.yml --device "Pixel 6a"
#
# Readiness wait: see perf-boot.yml header — wait for "Play" before openLink
# so the deep-link listener is wired and boot init is complete.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Play"
    timeout: 60000
- openLink: "pantvardowski://bench/particle-storm"
- extendedWaitUntil:
    visible:
      id: "BENCH_DONE"
    timeout: 60000
- assertVisible:
    id: "BENCH_DONE"
# See perf-boot.yml header for the copyTextFrom + evalScript rationale.
- copyTextFrom:
    id: "BENCH_DONE"
- evalScript: ${console.log(maestro.copiedText)}

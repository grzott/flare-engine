appId: dev.flare.pantvardowski
name: "PT Perf — zone-transitions"
tags:
  - perf
  - bench
---
# Perf scenario: zone-transitions
#
# Primary gate for Tier-C (Reanimated worklets). Despawns all Lifetime entities
# + clears boss FSMs every 5s to repeatedly trigger the GC-spike path that
# causes JS-thread frame-time spikes during zone wipes. Runs for 30s (6 cycles).
#
# Intended for the EAS bench profile (EXPO_PUBLIC_BENCH_MODE=1 baked).
#
# Run locally:  maestro test maestro/perf-zone-transitions.yml
# Run on cloud: testingbot maestro <apk> maestro/perf-zone-transitions.yml --device "Pixel 6a"
#
# Readiness wait: see perf-boot.yml header — wait for "Play" before openLink
# so the deep-link listener is wired and boot init is complete.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Play"
    timeout: 60000
- openLink: "pantvardowski://bench/zone-transitions"
- extendedWaitUntil:
    visible:
      id: "BENCH_DONE"
    timeout: 60000
- assertVisible:
    id: "BENCH_DONE"
# See perf-boot.yml header for the copyTextFrom + evalScript rationale.
- copyTextFrom:
    id: "BENCH_DONE"
- evalScript: ${console.log(maestro.copiedText)}

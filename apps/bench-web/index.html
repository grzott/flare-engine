<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <style>
      body {
        font-family: ui-monospace, monospace;
        background: #0b0f14;

        white-space: pre-wrap;
      }
      table {
        border-collapse: collapse;

        border: 1px solid #2a3542;

  <body>
    <h1>Flare bench-web — render suite (CanvasKit)</h1>

    <div id="status">loading…</div>
    <table id="results-table" hidden>
      <thead>
        <tr>
          <th>scenario</th>

          <th>p95 (ms)</th>
          <th>p99 (ms)</th>
        </tr>
      </thead>

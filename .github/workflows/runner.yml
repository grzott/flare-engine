name: runner

# Workstation-off runner: takes the next approved issue (`/start next`) and turns it into a PR as the
# agent bot. Chained on every merged claude/* PR, startable by hand, and resumed every six hours in
# case a usage limit stopped the chain. One PR in flight at a time.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'claude/'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.BOT_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BOT_LOGIN: ${{ vars.BOT_LOGIN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}

      # free -> start the next issue; blocked -> start /start anyway so it pings the owner;
      # inflight -> a PR is running its checks or waiting for the owner: nothing to do.
      - id: probe
        run: echo "state=$(bash scripts/runner/inflight.sh)" >> "$GITHUB_OUTPUT"

      - if: steps.probe.outputs.state != 'inflight'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - if: steps.probe.outputs.state != 'inflight'
        run: bun install --frozen-lockfile

      # A fresh checkout is an untrusted workspace: Claude Code runs the repo's hooks but ignores
      # its permissions.allow until the folder is trusted, which a headless run never is (the local
      # loop works because the workstation's checkout is trusted). CLI flags are not trust-gated,
      # so pass the same rules as flags — read from .claude/settings.json, the one source.
      - if: steps.probe.outputs.state != 'inflight'
        id: perms
        run: |
          echo "allow=$(jq -r '.permissions.allow | join(",")' .claude/settings.json)" >> "$GITHUB_OUTPUT"
          echo "deny=$(jq -r '.permissions.deny | join(",")' .claude/settings.json)" >> "$GITHUB_OUTPUT"

      - if: steps.probe.outputs.state != 'inflight'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.BOT_TOKEN }}
          bot_name: ${{ vars.BOT_LOGIN }}
          bot_id: ${{ vars.BOT_ID }}
          # The literal slash command, exactly what scripts/runner/loop.sh sends: it expands the
          # skill directly instead of asking the model to call the Skill tool.
          prompt: /start next
          # Quoted: each rule like "Bash(gh api:*)" contains a space, and an unquoted list splits.
          claude_args: |
            --model fable
            --permission-mode acceptEdits
            --allowedTools "${{ steps.perms.outputs.allow }}"
            --disallowedTools "${{ steps.perms.outputs.deny }}"

      # The session transcript stays out of this public log, but the denied tool calls and the
      # session's last message are printed: without them a run that stops early leaves no trace of
      # which rule was missing or why it stopped.
      - if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '.[] | select(.type == "result") | .permission_denials[]?
            | "denied: \(.tool_name) \(.tool_input | tostring | .[0:300])"' "$EXECUTION_FILE" || true
          jq -r '.[] | select(.type == "result") | "last message: \(.result // "-" | .[0:2000])"' \
            "$EXECUTION_FILE" || true

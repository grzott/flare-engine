name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Opt-in: enable once the @flare-engine scope exists on npm and
    # publishable packages have `"private": false`.
    if: ${{ vars.ENABLE_RELEASE == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test
      - run: bun run check:exports
      - run: bun run check:nodenext

      # B19: a publish must not be able to bypass the perf gate. ci.yml runs on
      # the same push, but a red CI does not stop this workflow — the two are
      # independent jobs, so the gate is repeated on the path that ships bytes
      # to consumers.
      - run: bun run check:perf
        env:
          FLARE_PERF_BASE_REF: ${{ github.event.before }}
      - run: bun run check:perf-bytes
      - run: bun run check:perf-freshness

      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          publish: bun run release
          version: bun run version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
